name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install SQLite, WebSocket, and development-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libwebsockets-dev python3
      - uses: leanprover/lean-action@v1
      - name: HTTP smoke test
        run: bash tests/http-smoke.sh
      - name: Development page smoke test
        run: bash tests/dev-pages-smoke.sh
      - name: Development watcher tests
        run: python3 -m unittest discover -s tests -p 'test_dev*.py'
      - name: WebSocket and SSE chat tests
        run: python3 -m unittest discover -s tests -p 'test_chat.py'
      - name: WebSocket protocol and Autobahn-style conformance tests
        run: python3 -m unittest discover -s tests -p 'test_ws_*.py'
